# Web build of the app (same code as the phone app). Netlify runs this on every push to the linked branch.
# EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY come from the site's Netlify environment variables.
# The build pulls the live listings first so every listing gets its own page that Google can read.
[build]
  publish = "dist"
  command = "node scripts/build-catalog.mjs && npx expo export --platform web && node scripts/sitemap.mjs"

[build.environment]
  NODE_VERSION = "22"

# Listings and invites added after the last build still open: serve the page template, which loads the data live.
[[redirects]]
  from = "/stays/*"
  to = "/stays/[slug].html"
  status = 200
[[redirects]]
  from = "/trips/*"
  to = "/trips/[slug].html"
  status = 200
[[redirects]]
  from = "/areas/*"
  to = "/areas/[area].html"
  status = 200
[[redirects]]
  from = "/join/*"
  to = "/join/[code].html"
  status = 200
[[redirects]]
  from = "/waiver/*"
  to = "/waiver/[id].html"
  status = 200
[[redirects]]
  from = "/post/*"
  to = "/post/[id].html"
  status = 200
[[redirects]]
  from = "/review/*"
  to = "/review/[token].html"
  status = 200
[[redirects]]
  from = "/host/listing/*"
  to = "/host/listing/[id].html"
  status = 200

[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

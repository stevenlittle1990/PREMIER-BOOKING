<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
  <!-- Start-screen scene: bay at Port O'Connor, a guide boat with an angler hooked up, a redfish jumping,
       and the beach in front. Main subjects sit in the middle 390px so a phone shows all of them. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd6df"/>
      <stop offset="0.55" stop-color="#cfeef0"/>
      <stop offset="1" stop-color="#f1faf6"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fa8"/>
      <stop offset="0.6" stop-color="#2aa3b4"/>
      <stop offset="1" stop-color="#5fcfca"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4e6c8"/>
      <stop offset="1" stop-color="#f7f0e3"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbe6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff5cf" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff5cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fishBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e4a32"/>
      <stop offset="0.55" stop-color="#b8693f"/>
      <stop offset="1" stop-color="#e9c9a0"/>
    </linearGradient>
    <clipPath id="aboveWater"><rect x="0" y="0" width="1200" height="171"/></clipPath>
    <path id="wave" d="M0 6 Q 30 0 60 6 T 120 6 T 180 6 T 240 6 T 300 6 T 360 6 T 420 6 T 480 6 T 540 6 T 600 6 T 660 6 T 720 6 T 780 6 T 840 6 T 900 6 T 960 6 T 1020 6 T 1080 6 T 1140 6 T 1200 6 T 1260 6 T 1320 6 T 1380 6"/>
    <style>
      .drift { animation: drift 7s linear infinite; }
      .drift.slow { animation-duration: 11s; }
      .drift.rev { animation-direction: reverse; animation-duration: 9s; }
      @keyframes drift { to { transform: translateX(-120px); } }
      .bob { transform-box: fill-box; transform-origin: 50% 85%; animation: bob 3.6s ease-in-out infinite alternate; }
      @keyframes bob { from { transform: translateY(0) rotate(-2.2deg); } to { transform: translateY(3px) rotate(2deg); } }
      .rod { transform-box: fill-box; transform-origin: 0% 100%; animation: tug 1.8s ease-in-out infinite alternate; }
      @keyframes tug { from { transform: rotate(0deg); } to { transform: rotate(5deg); } }
      .jump { animation: jump 6s cubic-bezier(.35,.0,.45,1) infinite; }
      @keyframes jump {
        0%, 50% { transform: translate(34px, 52px) rotate(50deg) scale(1.3); }
        64% { transform: translate(8px, -14px) rotate(10deg) scale(1.3); }
        71% { transform: translate(-6px, -22px) rotate(-8deg) scale(1.3); }
        86%, 100% { transform: translate(-44px, 56px) rotate(-58deg) scale(1.3); }
      }
      .splash1, .splash2 { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; }
      .splash1 { animation: splash1 6s ease-out infinite; }
      .splash2 { animation: splash2 6s ease-out infinite; }
      @keyframes splash1 { 0%, 55% { opacity: 0; transform: scale(.2); } 60% { opacity: .9; transform: scale(1); } 70%, 100% { opacity: 0; transform: scale(1.5); } }
      @keyframes splash2 { 0%, 80% { opacity: 0; transform: scale(.2); } 85% { opacity: .9; transform: scale(1); } 95%, 100% { opacity: 0; transform: scale(1.6); } }
      .gulls { animation: gulls 34s linear infinite; }
      @keyframes gulls { from { transform: translateX(-40px); } to { transform: translateX(260px); } }
      .flap { transform-box: fill-box; transform-origin: 50% 50%; animation: flap .9s ease-in-out infinite alternate; }
      @keyframes flap { to { transform: scaleY(.45); } }
      .foam { animation: foam 4.5s ease-in-out infinite alternate; }
      @keyframes foam { from { transform: translateX(0); opacity: .95; } to { transform: translateX(-10px) translateY(2px); opacity: .6; } }
      .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 3s ease-in-out infinite alternate; }
      @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
      .shimmer { animation: shimmer 2.4s ease-in-out infinite alternate; }
      @keyframes shimmer { from { opacity: .25; } to { opacity: .7; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- sky and sun -->
  <rect width="1200" height="260" fill="url(#sky)"/>
  <circle cx="742" cy="62" r="74" fill="url(#glow)"/>
  <circle cx="742" cy="62" r="20" fill="#fff6d2"/>

  <!-- far shore: Matagorda Island dunes and a light on the jetty -->
  <path d="M0 122 C 120 112 220 116 330 119 C 430 121 520 112 610 116 C 700 120 820 110 930 115 C 1040 120 1120 113 1200 117 V 128 H 0 Z" fill="#7fb9ad" opacity=".55"/>
  <path d="M960 116 v-14 h4 v14" fill="#6b9a92" opacity=".7"/>

  <!-- the bay -->
  <rect x="0" y="124" width="1200" height="96" fill="url(#sea)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <g class="drift slow" opacity=".35" stroke-width="1.6"><use href="#wave" y="132"/></g>
    <g class="drift rev" opacity=".28" stroke-width="1.8"><use href="#wave" y="150" x="-40"/></g>
    <g class="drift" opacity=".35" stroke-width="2"><use href="#wave" y="176" x="-20"/></g>
    <g class="drift slow" opacity=".3" stroke-width="2.2"><use href="#wave" y="198" x="-70"/></g>
  </g>
  <!-- sun on the water -->
  <g class="shimmer" fill="#fffbe6">
    <rect x="716" y="131" width="52" height="2.2" rx="1.1"/>
    <rect x="724" y="139" width="36" height="2" rx="1"/>
    <rect x="731" y="147" width="22" height="1.8" rx=".9"/>
  </g>

  <!-- gulls -->
  <g class="gulls" fill="none" stroke="#2c4f5c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(640 34)"><path class="flap" d="M-9 0 Q -4 -6 0 0 Q 4 -6 9 0"/></g>
    <g transform="translate(664 24) scale(.75)"><path class="flap" d="M-9 0 Q -4 -6 0 0 Q 4 -6 9 0"/></g>
  </g>

  <!-- guide boat with an angler hooked up -->
  <g class="bob">
    <g transform="translate(628 136)">
      <!-- wake shadow -->
      <ellipse cx="44" cy="34" rx="58" ry="4" fill="#17657f" opacity=".35"/>
      <!-- angler (behind rail) -->
      <g fill="#0c3a52">
        <rect x="14" y="2" width="9" height="20" rx="3"/>
        <circle cx="18.5" cy="-3" r="4.6"/>
        <path d="M11.5 -5.2 h14 l-2.5 -2.2 h-9 z"/>
        <path d="M21 6 l-12 -4" stroke="#0c3a52" stroke-width="3.2" stroke-linecap="round"/>
      </g>
      <!-- rod bent toward the fish, and the line -->
      <g class="rod">
        <path d="M10 2 Q -8 -16 -30 -10" fill="none" stroke="#1b2b36" stroke-width="2" stroke-linecap="round"/>
      </g>
      <path d="M-30 -10 Q -42 12 -48 34" fill="none" stroke="#ffffff" stroke-width=".9" opacity=".9"/>
      <!-- console and T-top -->
      <rect x="40" y="0" width="16" height="20" rx="2" fill="#e9eef1"/>
      <rect x="42" y="3" width="12" height="6" rx="1" fill="#6fb8c9"/>
      <path d="M36 -12 h26" stroke="#0c3a52" stroke-width="3" stroke-linecap="round"/>
      <path d="M40 -12 v12 M58 -12 v12" stroke="#0c3a52" stroke-width="1.6"/>
      <!-- hull -->
      <path d="M0 20 H 96 Q 92 32 78 34 H 10 Q 2 30 0 20 Z" fill="#ffffff"/>
      <path d="M2 25 H 93" stroke="#0c3a52" stroke-width="2.4"/>
      <path d="M96 20 l6 -3 v5 z" fill="#ffffff"/>
      <!-- motor -->
      <path d="M-4 16 h7 v16 h-5 z" fill="#1b2b36"/>
    </g>
  </g>

  <!-- redfish jumping off the line, with splashes -->
  <g transform="translate(580 170)">
    <g clip-path="url(#aboveWater)" transform="translate(-580 -170)">
      <g transform="translate(580 170)">
        <g class="jump">
          <g transform="translate(-24 -8)">
            <path d="M0 8 C 8 -1 26 -3 38 4 L 50 -3 L 47 8 L 50 19 L 38 12 C 26 19 8 17 0 8 Z" fill="url(#fishBody)"/>
            <path d="M14 1 Q 22 -6 30 0" fill="#8e4a32"/>
            <circle cx="38.5" cy="7.6" r="3" fill="#111a20"/>
            <circle cx="7" cy="6.2" r="1.5" fill="#111a20"/>
            <path d="M4 10.5 q 3 1.5 6 0" stroke="#5a2a1a" stroke-width="1" fill="none"/>
          </g>
        </g>
      </g>
    </g>
    <g class="splash1" transform="translate(30 -2)" fill="#ffffff"><path d="M-10 2 Q -6 -10 -3 2 Q 0 -14 3 2 Q 6 -10 10 2 Z" opacity=".9"/></g>
    <g class="splash2" transform="translate(-36 -2)" fill="#ffffff"><path d="M-12 2 Q -7 -12 -3 2 Q 0 -16 3 2 Q 7 -12 12 2 Z" opacity=".9"/></g>
  </g>

  <!-- beach in front -->
  <path d="M0 214 C 160 204 300 210 430 208 C 560 206 700 214 830 210 C 960 206 1090 212 1200 208 V 260 H 0 Z" fill="url(#sand)"/>
  <g class="foam" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M-10 213 C 150 203 300 209 430 207 C 560 205 700 213 830 209 C 960 205 1090 211 1210 207"/>
  </g>
  <path d="M0 236 C 200 228 420 238 640 232 C 860 226 1000 236 1200 230 V 260 H 0 Z" fill="#efdcb6" opacity=".45"/>

  <!-- sea oats on the dune -->
  <g stroke="#a99a6a" stroke-width="1.8" stroke-linecap="round" fill="none">
    <g class="sway"><path d="M418 240 Q 414 222 420 206"/><path d="M420 206 q 4 -2 3 -8"/></g>
    <g class="sway" style="animation-delay:-1.2s"><path d="M428 242 Q 430 226 424 212"/><path d="M424 212 q -4 -3 -2 -8"/></g>
    <g class="sway" style="animation-delay:-.6s"><path d="M438 242 Q 440 228 446 218"/></g>
  </g>

  <!-- beach umbrella and towel -->
  <g transform="translate(728 200)">
    <ellipse cx="2" cy="40" rx="30" ry="4" fill="#d9c49b" opacity=".6"/>
    <rect x="-22" y="32" width="38" height="9" rx="2" fill="#6fd6d6" transform="rotate(-4)"/>
    <rect x="-22" y="35" width="38" height="2.4" fill="#ffffff" transform="rotate(-4)" opacity=".9"/>
    <path d="M2 -6 L 6 38" stroke="#7a6a52" stroke-width="2.4" stroke-linecap="round"/>
    <g transform="rotate(8 2 -6)">
      <path d="M-34 -2 Q 2 -40 38 -2 Z" fill="#0c3a52"/>
      <path d="M-22 -2 Q 2 -40 -10 -2 Z M14 -2 Q 2 -40 26 -2 Z" fill="#ffffff"/>
      <path d="M-34 -2 q 6 4 12 0 q 6 4 12 0 q 6 4 12 0 q 6 4 12 0 q 6 4 12 0 q 6 4 12 0" fill="#0c3a52"/>
    </g>
  </g>

  <!-- extra details for wide screens -->
  <g transform="translate(250 196)">
    <path d="M0 -4 L 3 30" stroke="#7a6a52" stroke-width="2.2"/>
    <path d="M-26 -1 Q 0 -32 28 -1 Z" fill="#1880a0"/>
    <path d="M-14 -1 Q 0 -32 -4 -1 Z M8 -1 Q 0 -32 16 -1 Z" fill="#ffffff"/>
  </g>
  <g transform="translate(1000 150) scale(.6)" opacity=".85">
    <path d="M0 20 H 70 Q 66 30 56 31 H 8 Q 2 28 0 20 Z" fill="#ffffff"/>
    <path d="M24 20 v-16 h12 v16" fill="#e9eef1"/>
    <path d="M44 4 l 14 16 h-14 z" fill="#ffffff" opacity=".9"/>
  </g>
</svg>
